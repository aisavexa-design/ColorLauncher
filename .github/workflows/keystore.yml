name: Make keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Keystore password (yaad rakhna, ye kahin aur nahi milega)'
        required: true

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          PW: ${{ github.event.inputs.password }}
        run: |
          keytool -genkeypair -v -keystore launchersam.jks -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 -alias launchersam \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=LauncherSam, O=AISavexa, C=IN"
          base64 -w 0 launchersam.jks > keystore_b64.txt

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore_b64.txt
